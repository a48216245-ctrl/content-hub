function migrate(){if(!Array.isArray(db.channelNames))db.channelNames=[...new Set([...channels,...db.contents.flatMap(c=>Object.keys(c.channels||{}))])];channels=db.channelNames;if(!channels.length){channels=['인스타그램'];db.channelNames=channels}db.contents.forEach(c=>{if(!c.status){let ss=Object.values(c.channels||{}).map(v=>v.status);c.status=['posted','approved','changes','review','draft'].find(x=>ss.includes(x))||'draft'}})}migrate();let view='home',actor='u1',current='c1',tab='인스타그램',page=0,split='43%',calendarMonth=new Date().toISOString().slice(0,7),projectChannel='전체';const selectedChannels=c=>channels.filter(n=>(c.activeChannels||Object.keys(c.channels||{})).includes(n)), chooseChannels=(existing=[],callback)=>{const old=document.getElementById('channelModal');if(old)old.remove();const overlay=document.createElement('div');overlay.id='channelModal';overlay.className='modaloverlay';document.body.appendChild(overlay);let picked=new Set(existing);function paint(){overlay.innerHTML=`<div class="modalbox"><h2>게시 채널 선택 및 관리</h2><p class="muted">채널을 선택하거나 추가·이름 수정·삭제할 수 있습니다. 삭제 시 연결된 원고와 게시 정보도 삭제될 수 있습니다.</p><div class="channelchoices">${channels.map((n,i)=>`<div class="channelchoice" style="display:flex;align-items:center;gap:8px"><label style="display:flex;align-items:center;gap:8px;flex:1"><input type="checkbox" data-index="${i}" ${picked.has(n)?'checked':''}><span>${esc(n)}</span></label><button type="button" data-rename="${i}" title="채널 이름 수정">수정</button><button type="button" class="dangerbtn" data-delete="${i}" title="채널 삭제">삭제</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><button id="channelAdd" type="button">+ 채널 추가</button></div><div class="row" style="justify-content:flex-end;margin-top:20px"><button id="channelCancel">취소</button><button class="primary" id="channelSave">선택 완료</button></div></div>`;overlay.querySelectorAll('input[data-index]').forEach(el=>el.onchange=()=>{const n=channels[+el.dataset.index];if(el.checked)picked.add(n);else picked.delete(n)});overlay.querySelectorAll('[data-rename]').forEach(el=>el.onclick=()=>{const old=channels[+el.dataset.rename];let name=prompt('변경할 채널 이름',old);if(name===null)return;name=name.trim();if(!name||name!==old&&channels.includes(name))return alert('사용할 수 없는 채널 이름입니다.');if(name===old)return;db.channelNames[db.channelNames.indexOf(old)]=name;channels=db.channelNames;db.contents.forEach(c=>{if(c.channels?.[old]){c.channels[name]=c.channels[old];delete c.channels[old]}if(c.activeChannels)c.activeChannels=c.activeChannels.map(x=>x===old?name:x)});if(picked.delete(old))picked.add(name);if(tab===old)tab=name;if(projectChannel===old)projectChannel=name;log('채널 이름 변경: '+old+' → '+name);paint()});overlay.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{const n=channels[+el.dataset.delete];const used=db.contents.filter(c=>c.channels?.[n]);if(!confirm('채널 '+n+'을(를) 삭제할까요?'+(used.length?' 연결된 콘텐츠 '+used.length+'개의 해당 채널 원고·URL·코멘트도 삭제됩니다.':'')))return;db.channelNames=db.channelNames.filter(x=>x!==n);channels=db.channelNames;db.contents.forEach(c=>{if(c.channels)delete c.channels[n];if(c.activeChannels)c.activeChannels=c.activeChannels.filter(x=>x!==n)});picked.delete(n);if(tab===n)tab=channels[0]||'';if(projectChannel===n)projectChannel='전체';log('채널 삭제: '+n);paint()});overlay.querySelector('#channelAdd').onclick=()=>{let name=prompt('새 홍보 채널 이름');if(!name?.trim())return;name=name.trim();if(channels.includes(name))return alert('이미 등록된 채널입니다.');db.channelNames.push(name);channels=db.channelNames;picked.add(name);log('채널 추가: '+name);paint()};overlay.querySelector('#channelCancel').onclick=()=>overlay.remove();overlay.querySelector('#channelSave').onclick=()=>{const chosen=channels.filter(n=>picked.has(n));if(!chosen.length)return alert('최소 하나의 채널을 선택해 주세요.');overlay.remove();callback(chosen)}}paint();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()}}, newChannel=()=>({text:'',status:'draft',reviewer:db.users.find(u=>u.role==='reviewer')?.id||db.users[0]?.id,date:'',url:'',comments:[],version:1});const $=id=>document.getElementById(id), me=()=>db.users.find(u=>u.id===actor), who=id=>db.users.find(u=>u.id===id)?.name||'미지정', canEdit=()=>['editor','admin'].includes(me().role),canReview=()=>['reviewer','admin'].includes(me().role),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10), save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('저장 공간이 부족합니다. 이미지 크기를 줄여 주세요.')}},log=(text)=>{db.logs.unshift({id:uid(),time:new Date().toLocaleString('ko-KR'),actor, text});save()},cnow=()=>db.contents.find(c=>c.id===current),ch=()=>cnow().channels[tab],status=s=>({draft:'초안',review:'검토 대기',changes:'수정 요청',approved:'승인 완료',posted:'게시 완료'}[s]||s),pill=s=>`<span class="pill ${esc(s)}">${status(s)}</span>`,btn=(text,action,disabled=false,cls='')=>`<button class="${cls}" ${disabled?'disabled':''} onclick="${action}">${text}</button>`;
function setActor(id){actor=id;render()}function go(v){view=v;render()}function render(){const menus=[['home','대시보드'],['calendar','홍보 캘린더'],['contents','콘텐츠 관리'],['projects','채널 관리'],['reviews','검토'],['team','팀원 관리']];$('nav').innerHTML=menus.map(([id,n])=>`<button class="nav ${view===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('actor').innerHTML=db.users.map(u=>`<option value="${u.id}" ${u.id===actor?'selected':''}>${esc(u.name)} · ${{editor:'제작자',reviewer:'검토자',admin:'관리자'}[u.role]}</option>`).join('');$('title').textContent=menus.find(x=>x[0]===view)?.[1]||'Content Hub';$('subtitle').textContent='제작물 · 원고 · 검토 · 승인 · 게시 일정';$('app').innerHTML=({home:home,projects:projects,contents:contents,reviews:reviews,calendar:calendar,team:team,activity:activity})[view]();}
function home(){let recent=db.contents.flatMap(c=>selectedChannels(c).flatMap(n=>(c.channels[n].comments||[]).map(m=>({c,n,m})))).sort((a,b)=>(b.m.created||0)-(a.m.created||0)).slice(0,8);let all=db.contents;return `<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['전체 콘텐츠',all.length],['전체 채널',channels.length]].map(([a,b])=>`<div class="card stat"><div class="muted">${a}</div><b>${b}</b></div>`).join('')}</div><div class="card"><h2>콘텐츠 진행 현황 <span class="muted" style="font-size:13px">· 콘텐츠당 1회 집계</span></h2><div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[['검토 대기','review','stat-wait'],['수정 요청','changes','stat-change'],['승인 완료','approved','stat-approve'],['게시 완료','posted','stat-post']].map(([a,v,cls])=>`<div class="stat ${cls}"><div class="muted">${a}</div><b>${all.filter(c=>c.status===v).length}</b></div>`).join('')}</div></div><div class="two"><div class="card"><h2>내 작업</h2>${all.filter(c=>c.owner===actor && c.status!=='posted').map(c=>`<div class="item"><b>${esc(c.title)}</b> ${pill(c.status)}<p class="muted">${esc(db.projects.find(p=>p.id===c.project)?.name||'')}</p>${btn('콘텐츠 열기',`openContent('${c.id}')`)}</div>`).join('')||'<p class="muted">진행 중인 내 작업이 없습니다.</p>'}</div><div class="card"><h2>검토 대기</h2>${all.filter(c=>c.status==='review').map(c=>`<div class="item"><b>${esc(c.title)}</b><p class="muted">게시 채널: ${selectedChannels(c).map(esc).join(', ')}</p>${btn('검토하기',`openContent('${c.id}')`)}</div>`).join('')||'<p class="muted">검토 대기 항목이 없습니다.</p>'}</div></div><div class="card"><h2>최근 등록된 코멘트</h2>${recent.map(x=>`<div class="commentalert"><div class="row between"><b>${esc(x.c.title)} · ${esc(x.n)}</b><span class="muted">${esc(who(x.m.actor))} · ${esc(x.m.time)}</span></div><div>${esc(x.m.text)}</div>${btn('콘텐츠 열기',`openContent('${x.c.id}','${x.n}')`)}</div>`).join('')||'<p class="muted">등록된 코멘트가 없습니다.</p>'}</div>`}
function projects(){
 const selected=channels.includes(projectChannel)?projectChannel:'인스타그램';
 const rows=db.contents.filter(c=>selectedChannels(c).includes(selected)).map(c=>({c,v:c.channels[selected]}));
 return `<div class="card"><div class="row between"><h2>채널 관리</h2></div><p class="muted">콘텐츠 등록 또는 편집에서 추가한 채널별 게시물과 URL을 조회할 수 있습니다.</p><div class="tabs">${channels.map(n=>`<button class="${selected===n?'active':''}" onclick="projectChannel='${n}';render()">${esc(n)}</button>`).join('')}</div><div class="row between" style="margin:18px 0 10px"><h3 style="margin:0">${esc(selected)} 콘텐츠</h3><span class="pill">${rows.length}건</span></div><div style="overflow-x:auto"><table><thead><tr><th>콘텐츠</th><th>유형</th><th>진행 상태</th><th>게시 URL</th><th>관리</th></tr></thead><tbody>${rows.map(({c,v})=>`<tr><td><b>${esc(c.title)}</b></td><td>${esc(c.kind)}</td><td>${pill(c.status)}</td><td>${/^https?:\/\//i.test(v.url?.trim()||'')?`<a class="url-link" href="${esc(v.url.trim())}" target="_blank" rel="noopener noreferrer">게시물 보기 ↗</a>`:'<span class="muted">URL 미등록</span>'}</td><td>${btn('콘텐츠 열기',`openContent('${c.id}','${selected}')`)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">이 채널에 등록된 콘텐츠가 없습니다.</td></tr>'}</tbody></table></div></div>`
}
function addProject(){let name=prompt('프로젝트 이름');if(!name?.trim())return;db.projects.push({id:uid(),name:name.trim(),description:'',start:'',end:''});log('프로젝트 생성: '+name);render()}
function addContent(pid){let id=uid();let first=channels[0]||'인스타그램';if(!channels.length){db.channelNames.push(first);channels=db.channelNames}db.contents.push({id,project:pid,title:'새 콘텐츠',kind:'카드뉴스',images:[],owner:actor,activeChannels:[first],status:'draft',channels:{[first]:newChannel()}});log('새 콘텐츠 생성');openContent(id,first)}
function editChannels(id){if(!canEdit())return;let c=db.contents.find(x=>x.id===id);if(!c)return;chooseChannels(selectedChannels(c),chosen=>{for(let n of chosen)if(!c.channels[n])c.channels[n]=newChannel();c.activeChannels=chosen;if(current===id&&!chosen.includes(tab))tab=chosen[0];log('콘텐츠 게시 채널 선택: '+c.title+' / '+chosen.join(', '));if(view==='editor')renderEditor();else render()})}
function contents(){return `<div class="card"><div class="row between"><h2>콘텐츠 목록</h2><div class="row"><span class="muted">콘텐츠를 열어 제목·유형·게시 채널을 수정할 수 있습니다</span>${btn("+ 콘텐츠 추가","addContent(db.projects[0]?.id||'')",false,"primary")}</div></div>${db.contents.map(c=>`<div class="item row between"><div>${c.status==='changes'?pill(c.status)+' ':''}<b>${esc(c.title)}</b><div class="muted">${esc(db.projects.find(p=>p.id===c.project)?.name||'')} · ${esc(c.kind)} · 담당 ${esc(who(c.owner))}</div><div class="row" style="margin-top:7px">${selectedChannels(c).map(n=>`<span title="${esc(n)}">${esc(n)}</span>`).join('')}</div></div><div class="row">${btn('삭제',`deleteContent('${c.id}')`,!canEdit(),'dangerbtn')}${btn('열기',`openContent('${c.id}')`,false,'primary')}</div></div>`).join('')}</div>`}
function editContent(id){if(!canEdit())return;let c=db.contents.find(x=>x.id===id);if(!c)return;let title=prompt('콘텐츠 제목 수정',c.title);if(title===null||!title.trim())return;let kind=prompt('콘텐츠 유형 (카드뉴스 / 포스터 / 기타)',c.kind);if(kind===null)return;c.title=title.trim();c.kind=kind.trim()||c.kind;log('콘텐츠 수정: '+c.title);render()}
function deleteContent(id){if(!canEdit())return;let c=db.contents.find(x=>x.id===id);if(!c||!confirm('"'+c.title+'" 콘텐츠와 연결된 원고·코멘트·일정을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.'))return;db.contents=db.contents.filter(x=>x.id!==id);log('콘텐츠 삭제: '+c.title);if(current===id)current=db.contents[0]?.id||'';go('contents')}
function renameContent(){editContent(current);renderEditor()}
function openContent(id,n){current=id;let target=db.contents.find(c=>c.id===id);if(n&&target?.channels[n])tab=n;else if(target&&!target.channels[tab])tab=selectedChannels(target)[0];page=0;view='editor';renderEditor()}
function renderEditor(){
 const c=cnow();if(!c){go('contents');return}
 if(!c.channels[tab])tab=selectedChannels(c)[0];
 const v=ch(),editable=canEdit(),approved=c.status==='approved',img=c.images[page];
 $('title').textContent='콘텐츠 · 원고 동시 편집';$('subtitle').textContent=c.title;
 $('app').innerHTML=`
 <div class="row between" style="margin-bottom:15px">${btn('← 콘텐츠 목록',"go('contents')")}
 <div class="row"><span class="muted">화면 비율</span><select style="width:150px" onchange="split=this.value;renderEditor()"><option value="43%" ${split==='43%'?'selected':''}>균등 보기</option><option value="60%" ${split==='60%'?'selected':''}>이미지 크게</option><option value="30%" ${split==='30%'?'selected':''}>원고 크게</option></select></div></div>
 <div class="contentgrid" style="grid-template-columns:minmax(240px,${split}) minmax(300px,1fr)">
 <section class="card"><h2>제작물 미리보기</h2><div class="preview">${img?`<img src="${img.data}" alt="${esc(img.name)}">`:'<div class="muted">등록된 이미지가 없습니다.<br>카드뉴스·포스터를 업로드하세요.</div>'}</div>
 <div class="row between" style="margin-top:10px">${btn('◀ 이전','changePage(-1)',page===0)}<span class="muted">${c.images.length?`${page+1} / ${c.images.length}`:'0 / 0'}</span>${btn('다음 ▶','changePage(1)',page>=c.images.length-1)}</div>
 <hr class="sep"><label>제작물 업로드</label><p class="muted">여러 장을 선택하면 선택 순서대로 업로드됩니다.</p><input type="file" multiple accept="image/*" onchange="uploadImages(this)" ${!canEdit()?'disabled':''}>
 ${img?`<p class="muted">${esc(img.name)}</p><div class="row">${btn('앞으로 이동','moveImage(-1)',!canEdit()||page===0)}${btn('뒤로 이동','moveImage(1)',!canEdit()||page>=c.images.length-1)}${btn('이미지 삭제','removeImage()',!canEdit())}</div>`:''}</section>
 <div class="stack" style="align-content:start">
 <section class="card" style="position:relative;margin-bottom:0">
 <div class="row between" style="margin-bottom:14px"><h2 style="margin:0">콘텐츠 정보 수정</h2>${btn('콘텐츠 삭제',`deleteContent('${c.id}')`,!canEdit(),'dangerbtn')}</div>
 <label for="editTitle">콘텐츠 제목</label><input id="editTitle" value="${esc(c.title)}" ${!canEdit()?'disabled':''}>
 <div style="margin-top:12px"><label for="editKind">콘텐츠 유형</label><select id="editKind" ${!canEdit()?'disabled':''}>${['카드뉴스','포스터','기타'].map(k=>`<option ${c.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>
 <div class="row" style="justify-content:flex-end;margin-top:12px">${btn('제목·유형 저장','saveContentDetails()',!canEdit(),'primary')}</div>
 <hr class="sep"><div class="row between"><h3 style="margin:0">게시 채널 선택</h3>${btn('채널 선택 변경',`editChannels('${c.id}')`,!canEdit())}</div>
 <div class="row" style="margin-top:10px">${selectedChannels(c).map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>
 <p class="muted">게시할 채널만 선택하며, 선택 해제한 채널의 기존 원고는 보관됩니다.</p>
 </section>
 <section class="card" style="margin-bottom:0"><div class="row between"><h2>선택한 채널의 홍보 원고</h2>${pill(c.status)}</div>
 <div class="tabs">${selectedChannels(c).map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';renderEditor()">${n}</button>`).join('')}</div>
 <label>원고 (${v.text.length}자) · 버전 ${v.version}</label><textarea id="draft" ${!editable?'readonly':''} oninput="document.getElementById('length').textContent=this.value.length+'자'">${esc(v.text)}</textarea>
 <div class="row between" style="margin-top:8px"><span id="length" class="muted">${v.text.length}자</span><div class="row">${btn('원고 복사','copyText()')}${btn('원고 저장','saveText()',!editable,'primary')}</div></div>
 <hr class="sep"><div class="two"><div><label>게시 예정일</label><input type="date" id="postdate" value="${esc(v.date)}" ${!canEdit()?'disabled':''} onchange="saveMeta()"></div><div><label>검토 담당자</label><select id="reviewer" onchange="saveMeta()" ${!canEdit()?'disabled':''}>${db.users.filter(u=>['reviewer','admin'].includes(u.role)).map(u=>`<option value="${u.id}" ${u.id===v.reviewer?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
 <div style="margin-top:12px"><label>실제 게시 URL</label><input id="posturl" type="url" placeholder="https://..." value="${esc(v.url)}" ${!canEdit()?'disabled':''} onchange="saveMeta()"></div>
 <div class="row" style="margin-top:15px;align-items:end;flex-wrap:wrap"><label for="statusPicker" style="margin:0;font-weight:600">진행 상태 변경 (콘텐츠 전체)</label><select id="statusPicker" aria-label="진행 상태 변경" style="width:auto;min-width:145px" onchange="changeStatus(this.value)">${['draft','review','changes','approved','posted'].map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div>
 </section></div></div>
 <section class="card" style="margin-top:16px"><div class="row between"><h2>검토 코멘트</h2><span class="muted">${esc(c.title)} · ${esc(tab)} · ${v.comments.length}건</span></div>
 <div>${v.comments.map(m=>`<div class="comment"><b>${esc(who(m.actor))}</b> <span class="muted">${esc(m.time)}</span><div>${esc(m.text).replace(/\n/g,'<br>')}</div></div>`).join('')||'<p class="muted">아직 코멘트가 없습니다.</p>'}</div>
 <label for="comment">제작물과 원고에 대한 검토 의견</label><textarea id="comment" style="min-height:95px" placeholder="카드뉴스 디자인, 제목, 홍보 문구 등에 대한 수정 의견을 작성해 주세요."></textarea>
 <div class="row" style="justify-content:flex-end;margin-top:10px">${btn('코멘트 등록','addComment()',false,'primary')}</div></section>`;
}
function saveContentDetails(){if(!canEdit())return;const c=cnow(),title=$('editTitle').value.trim(),kind=$('editKind').value;if(!title){alert('콘텐츠 제목을 입력해 주세요.');return}c.title=title;c.kind=kind;log('콘텐츠 정보 수정: '+title+' / '+kind);renderEditor()}
function changePage(n){page+=n;renderEditor()}function setKind(v){cnow().kind=v;log('콘텐츠 유형 변경: '+v);renderEditor()}function moveImage(n){let a=cnow().images,i=page,j=i+n;[a[i],a[j]]=[a[j],a[i]];page=j;log('이미지 순서 변경');renderEditor()}function removeImage(){if(!confirm('현재 이미지를 삭제할까요?'))return;cnow().images.splice(page,1);page=Math.max(0,Math.min(page,cnow().images.length-1));log('이미지 삭제');renderEditor()}
async function uploadImages(el){for(const file of el.files){if(file.size>2.5*1024*1024){alert(file.name+' 파일은 2.5MB를 초과합니다.');continue}const data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});cnow().images.push({name:file.name,data})}log('이미지 업로드');renderEditor()}
function saveText(){let v=ch();v.text=$('draft').value;v.version++;log(`${cnow().title} / ${tab} 원고 저장 (v${v.version})`);renderEditor()}function copyText(){navigator.clipboard?.writeText($('draft').value).then(()=>alert('원고를 복사했습니다.')).catch(()=>{ $('draft').select();document.execCommand('copy');alert('원고를 복사했습니다.')})}function saveMeta(){let v=ch();v.date=$('postdate').value;v.reviewer=$('reviewer').value;v.url=$('posturl').value;log(`${tab} 게시 정보 변경`)}function changeStatus(next){if(!['draft','review','changes','approved','posted'].includes(next))return;let c=cnow();if(c.status===next)return;c.status=next;log(`${c.title} 콘텐츠 전체 상태 변경: ${status(next)} (${me().name})`);renderEditor()}function requestReview(){if(!canEdit())return;let v=ch();v.text=$('draft').value;v.status='review';v.version++;log(`${cnow().title} / ${tab} 검토 요청`);renderEditor()}function decision(s){if(!canReview()||!['changes','approved'].includes(s)||!['draft','review','changes'].includes(ch().status))return;let v=ch();v.status=s;log(`${cnow().title} / ${tab} ${s==='changes'?'검토 완료 · 수정 요청':status(s)}`);renderEditor()}function markPosted(){if(!canEdit()||ch().status!=='approved')return;let v=ch();if(!v.url.trim()&&!confirm('게시 URL 없이 완료 처리할까요?'))return;v.status='posted';log(`${cnow().title} / ${tab} 게시 완료`);renderEditor()}function addComment(){let val=$('comment').value.trim();if(!val)return;ch().comments.push({actor,time:new Date().toLocaleString('ko-KR'),text:val,created:Date.now()});log(`${cnow().title} / ${tab} 코멘트 등록`);renderEditor()}
function reviews(){let a=db.contents.filter(c=>['review','changes','approved','posted'].includes(c.status));return `<div class="card"><h2>콘텐츠별 검토·승인 현황</h2><p class="muted">승인 상태는 콘텐츠 전체에 한 번만 적용됩니다. 채널별 원고와 URL은 독립적으로 관리합니다.</p><table><thead><tr><th>콘텐츠</th><th>게시 채널</th><th>상태</th><th></th></tr></thead><tbody>${a.map(c=>`<tr><td>${esc(c.title)}</td><td>${selectedChannels(c).map(esc).join(', ')}</td><td>${pill(c.status)}</td><td>${btn('열기',`openContent('${c.id}')`)}</td></tr>`).join('')||'<tr><td colspan="4">검토 대상이 없습니다.</td></tr>'}</tbody></table></div>`}
function changeMonth(delta){let [y,m]=calendarMonth.split('-').map(Number);let d=new Date(y,m-1+delta,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function calendar(){let [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=first.getDay(),last=new Date(y,m,0).getDate();
// 동일 콘텐츠가 여러 채널에 등록되어도 같은 날짜에는 한 번만 표시합니다.
// 채널마다 게시 날짜가 다르면 해당 날짜에 각각 한 번씩 표시합니다.
let grouped=new Map();
db.contents.forEach(c=>selectedChannels(c).forEach(n=>{const v=c.channels?.[n];if(!v?.date)return;const key=JSON.stringify([c.id,v.date]);if(!grouped.has(key))grouped.set(key,{c,date:v.date,names:[]});grouped.get(key).names.push(n)}));
let events=[...grouped.values()];
let cells=Array.from({length:Math.ceil((offset+last)/7)*7},(_,i)=>{let day=i-offset+1,inMonth=day>0&&day<=last,d=new Date(y,m-1,day),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let es=events.filter(x=>x.date===date);return `<div class="calday ${inMonth?'':'out'}"><b>${d.getDate()}</b>${es.map(x=>`<button class="calevent pill ${esc(x.c.status)}" title="${esc(x.c.title)} / ${esc(x.names.join(', '))}" onclick="openContent('${x.c.id}')">${esc(x.c.title)} ${status(x.c.status)}</button>`).join('')}</div>`}).join('');return `<div class="card"><div class="row between"><h2>월간 홍보 캘린더</h2><div class="row">${btn('◀ 이전 달','changeMonth(-1)')}<b>${y}년 ${m}월</b>${btn('다음 달 ▶','changeMonth(1)')}</div></div><div class="row" style="margin-bottom:12px">${['review','changes','approved','posted','draft'].map(x=>pill(x)).join('')}</div><div class="calgrid">${['일','월','화','수','목','금','토'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells}</div><p class="muted">같은 날짜에 등록된 동일 콘텐츠는 하나로 표시합니다. 일정을 클릭하면 콘텐츠의 채널별 원고와 게시일을 수정할 수 있습니다.</p></div>`}

function addChannel(){let name=prompt('추가할 홍보 채널 이름');if(!name||!name.trim())return;name=name.trim();if(channels.includes(name))return alert('이미 등록된 채널입니다.');db.channelNames.push(name);channels=db.channelNames;log('홍보 채널 추가: '+name);projectChannel=name;render()}
function safeUrl(v){try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function team(){return `<div class="card"><div class="row between"><h2>팀원 및 역할</h2>${btn('+ 사용자 추가','addUser()',false,'primary')}</div><table><thead><tr><th>이름</th><th>역할</th><th>작업</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${{editor:'제작자',reviewer:'검토자',admin:'관리자'}[u.role]||esc(u.role)}</td><td><div class="row">${btn('수정',`editUser('${u.id}')`)}${btn('삭제',`deleteUser('${u.id}')`,db.users.length<=1,'dangerbtn')}</div></td></tr>`).join('')}</tbody></table></div>`}
function selectRole(current){let answer=prompt('역할을 선택하세요: 1 제작자 / 2 검토자 / 3 관리자',({editor:'1',reviewer:'2',admin:'3'})[current]||'1');if(answer===null)return null;let role=({'1':'editor','2':'reviewer','3':'admin',editor:'editor',reviewer:'reviewer',admin:'admin'})[answer.trim()];if(!role){alert('1, 2, 3 중 하나를 입력해 주세요.');return null}return role}
function editUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;let name=prompt('팀원 이름을 입력하세요',u.name);if(name===null)return;name=name.trim();if(!name)return alert('이름을 입력해 주세요.');let role=selectRole(u.role);if(!role)return;const before=u.name+' / '+u.role;u.name=name;u.role=role;log('팀원 정보 수정: '+before+' → '+name+' / '+role);render()}
function deleteUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;if(db.users.length<=1)return alert('마지막 팀원은 삭제할 수 없습니다.');if(!confirm(u.name+' 팀원을 삭제할까요?\n기존 콘텐츠와 코멘트는 보존되며, 담당자 연결은 미지정으로 변경됩니다.'))return;db.users=db.users.filter(x=>x.id!==id);db.contents.forEach(c=>{if(c.owner===id)c.owner='';Object.values(c.channels||{}).forEach(v=>{if(v.reviewer===id)v.reviewer=''})});if(actor===id)actor=db.users[0].id;log('팀원 삭제: '+u.name);render()}
function addUser(){let name=prompt('새 사용자 이름');if(name===null)return;name=name.trim();if(!name)return alert('이름을 입력해 주세요.');let role=selectRole('editor');if(!role)return;db.users.push({id:uid(),name,role});log('사용자 추가: '+name);render()}
function activity(){return `<div class="card"><h2>작업 및 승인 이력</h2>${db.logs.map(x=>`<div class="log"><b>${esc(x.text)}</b><div class="muted">${esc(x.time)} · ${esc(who(x.actor))}</div></div>`).join('')||'<p class="muted">아직 활동 이력이 없습니다.</p>'}</div>`}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='content-hub-team-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){let f=el.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.contents)||!Array.isArray(d.users))throw Error('잘못된 형식');if(!confirm('현재 데이터를 백업 파일로 교체할까요?'))return;db=d;migrate();save();go('calendar')}catch(e){alert('백업 파일을 읽을 수 없습니다: '+e.message)}}render();
</script></body></html>
